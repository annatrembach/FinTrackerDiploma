# --- App ---
spring.application.name=AIService
server.port=8084

jwt.secret=${JWT_SECRET}

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5433/FinanceTracker
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.amqp.deserialization.trust.all=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit=DEBUG
logging.level.org.springframework.amqp.rabbit.listener=DEBUG

# --- Spring AI: OpenRouter ( OpenAI API ) ---
spring.ai.openai.api-key=${API_KEY}
spring.ai.openai.chat.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=inclusionai/ring-2.6-1t:free

# --- Spring AI: Embeddings ( TEI Docker )---
spring.ai.openai.embedding.base-url=http://localhost:8085
spring.ai.openai.embedding.api-key=placeholder
spring.ai.openai.embedding.options.model=sentence-transformers/all-MiniLM-L6-v2

# --- VectorStore (pgvector) ---
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.initialize-schema=true

# --- Custom config ---
app.doc.ingestion.docs-path=classpath:docs/
app.doc.ingestion.chunk-size=800
app.doc.ingestion.chunk-overlap=150

app.doc.search.top-k=4
app.doc.search.similarity-threshold=0.2

app.analysis.max-transactions=200