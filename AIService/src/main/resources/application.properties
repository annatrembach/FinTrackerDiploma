spring.application.name=AIService
server.port=8084

jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:postgresql://localhost:5432/FinanceTracker
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.amqp.deserialization.trust.all=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit=DEBUG
logging.level.org.springframework.amqp.rabbit.listener=DEBUG

spring.ai.openai.api-key=${API_KEY}
spring.ai.openai.chat.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=tencent/hy3-preview:free

spring.data.redis.host=localhost
spring.data.redis.port=6379